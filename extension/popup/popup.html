<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT 卡顿修复</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>ChatGPT 卡顿修复</h1>
    </header>

    <main class="body">
      <label class="row toggle-row">
        <span>启用裁剪</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row">
        <span>保留最近轮数</span>
        <span class="keep-value"><output id="keepValue">15</output></span>
      </label>
      <input type="range" id="keepTurns" min="4" max="60" step="1" value="15" class="slider" />

      <label class="row toggle-row">
        <span>调试日志</span>
        <input type="checkbox" id="debug" />
      </label>

      <section class="status" id="status" hidden>
        <div class="status-title">当前对话</div>
        <div class="status-grid">
          <div><span id="statRendered">–</span><small>已渲染</small></div>
          <div><span id="statTotal">–</span><small>总计</small></div>
        </div>
        <div class="status-note" id="statNote"></div>
      </section>

      <div class="reload-hint" id="reloadHint" hidden>
        <span>改动需刷新页面后生效</span>
        <button type="button" id="reloadBtn">刷新页面</button>
      </div>
    </main>

    <footer class="footer">完全本地 · 无账号 · 无遥测</footer>

    <script src="popup.js"></script>
  </body>
</html>
